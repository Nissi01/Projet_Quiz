spring:
  # Secrets locaux (JWT_SECRET, ADMIN_PASSWORD...) lus depuis backend/.env, non versionné.
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/studyquiz}
    username: ${DB_USER:studyquiz}
    password: ${DB_PASSWORD:studyquiz_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
server:
  error:
    include-message: never
app:
  cors-origin: ${CORS_ORIGIN:http://localhost:5173}
  jwt:
    # Obligatoire, au moins 32 caractères : pas de valeur par défaut.
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:PT24H}
  admin:
    # Compte admin créé au démarrage s'il n'existe pas encore.
    username: ${ADMIN_USERNAME:admin}
    email: ${ADMIN_EMAIL:admin@studyquiz.local}
    # Obligatoire, au moins 12 caractères : pas de valeur par défaut.
    password: ${ADMIN_PASSWORD}
  import:
    enabled: ${IMPORT_SEED:true}
    location: classpath:questions.csv

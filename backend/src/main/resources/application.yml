spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/studyquiz}
    username: ${DB_USER:studyquiz}
    password: ${DB_PASSWORD:studyquiz_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
server:
  error:
    include-message: never
app:
  cors-origin: ${CORS_ORIGIN:http://localhost:5173}
  import:
    enabled: ${IMPORT_SEED:true}
    location: classpath:questions.csv
